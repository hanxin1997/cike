name: Build Windows

"on":
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this tested version to this repository Releases'
        required: true
        default: false
        type: boolean
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    outputs:
      version: ${{ steps.archive.outputs.version }}
    steps:
      # Always build this repository. Upstream changes are adopted explicitly by its owner.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
      - name: Install and verify Chromium through application code
        run: |
          node scripts/prepare-test-browser.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Application Chromium installation failed.' }
      - name: Security, network, portable paths and update regression tests
        timeout-minutes: 12
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
      - name: Desktop integration tests
        timeout-minutes: 5
        run: |
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop integration tests failed.' }
      - name: Package Windows x64
        run: |
          npm run pack:win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed.' }
      - name: Test packaged portable app, kernel download and relocation
        env:
          DEBUG: pw:browser
        run: |
          $env:CIKE_TEST_APP = Join-Path $PWD 'dist/CIKE-win32-x64/CIKE.exe'
          node --test test/portable-desktop.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Packaged portable application tests failed.' }
      - name: Verify package and create ZIP
        id: archive
        run: ./scripts/archive-windows.ps1
      - name: Verify real update handoff and restart
        env:
          DEBUG: pw:browser
        run: |
          $env:CIKE_TEST_APP = Join-Path $PWD 'dist/CIKE-win32-x64/CIKE.exe'
          node --test test/update-desktop.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Real packaged update and restart test failed.' }
      - uses: actions/upload-artifact@v7
        with:
          name: CIKE-${{ steps.archive.outputs.version }}-win-x64-${{ github.run_id }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: CIKE-${{ needs.build.outputs.version }}-win-x64-${{ github.run_id }}
          path: artifacts
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          BUILD_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Refuse duplicate versions: a release should identify one immutable tested build.
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'This version already exists. Bump package.json and package-lock.json before publishing.' >&2
            exit 1
          fi
          cp artifacts/BUILD-INFO.txt release-notes.txt
          gh release create "v$RELEASE_VERSION" --target "$BUILD_COMMIT" --title "CIKE $RELEASE_VERSION for Windows" --notes-file release-notes.txt artifacts/*.zip artifacts/SHA256SUMS-win-x64.txt artifacts/BUILD-INFO.txt
